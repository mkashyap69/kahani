# Local stack: Postgres, Redis, MinIO (S3), migrations, web UI and pipeline worker.
#   cp .env.example .env   # add API keys (optional — mocks are used without them)
#   docker compose up --build
#   open http://localhost:3000
x-app: &app
  build: .
  image: kahani-studio:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kahani
    REDIS_URL: redis://redis:6379
    STORAGE_DRIVER: s3
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: kahani
    S3_ACCESS_KEY_ID: minioadmin
    S3_SECRET_ACCESS_KEY: minioadmin
    S3_FORCE_PATH_STYLE: "true"
    WORK_DIR: /work
    APP_URL: ${APP_URL:-http://localhost:3000}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kahani }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/kahani"]

  migrate:
    build: .
    image: kahani-studio:local
    env_file: .env
    environment: { DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kahani }
    depends_on: { postgres: { condition: service_healthy } }
    command: ["sh", "-c", "npx prisma migrate deploy --schema packages/core/prisma/schema.prisma && npx tsx packages/core/prisma/seed.ts"]

  web:
    <<: *app
    ports: ["3000:3000"]
    command: ["npx", "next", "start", "apps/web", "-p", "3000"]

  worker:
    <<: *app
    command: ["npx", "tsx", "apps/worker/src/index.ts"]
    volumes: [work:/work]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, work: {} }
